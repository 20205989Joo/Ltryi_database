<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Ink Test</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #151515; color: #f5f5f5; }
    #bar { position: fixed; inset: 0 0 auto 0; z-index: 2; display: flex; gap: 8px; align-items: center; padding: 10px; background: rgba(20, 20, 20, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.12); }
    input, select, button { height: 32px; border: 1px solid #555; border-radius: 4px; background: #242424; color: #f5f5f5; padding: 0 10px; }
    button { cursor: pointer; }
    button:hover { background: #333; }
    #status { margin-left: auto; color: #9ee493; font-size: 13px; }
    #ink { position: fixed; inset: 53px 0 0 0; width: 100%; height: calc(100% - 53px); background: #fff; touch-action: none; cursor: crosshair; }
    #log { position: fixed; right: 10px; bottom: 10px; z-index: 2; width: min(520px, calc(100% - 20px)); max-height: 160px; margin: 0; padding: 10px; overflow: auto; border-radius: 4px; background: rgba(0, 0, 0, 0.72); color: #d7f7ff; font-size: 12px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="bar">
    <label>Room <input id="room" value="demo-room"></label>
    <label>Role
      <select id="role">
        <option value="teacher">teacher</option>
        <option value="student">student</option>
        <option value="viewer">viewer</option>
      </select>
    </label>
    <button id="connect">Connect</button>
    <button id="clear">Clear</button>
    <button id="star">Star</button>
    <span id="status">idle</span>
  </div>
  <canvas id="ink"></canvas>
  <pre id="log"></pre>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const canvas = document.getElementById('ink');
    const ctx = canvas.getContext('2d');
    const roomInput = document.getElementById('room');
    const roleInput = document.getElementById('role');
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    let socket = null;
    let drawing = false;
    let localLast = null;
    let lastEmitAt = 0;
    let strokeId = '';
    const remoteLastByStroke = new Map();

    function log(line) {
      logEl.textContent = `${new Date().toLocaleTimeString()} ${line}\n${logEl.textContent}`.slice(0, 4000);
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }

    function pointFromEvent(evt) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (evt.clientX - rect.left) / rect.width,
        y: (evt.clientY - rect.top) / rect.height,
        t: Date.now()
      };
    }

    function denorm(point) {
      const rect = canvas.getBoundingClientRect();
      return { x: point.x * rect.width, y: point.y * rect.height };
    }

    function drawLine(a, b, color, size) {
      const p1 = denorm(a);
      const p2 = denorm(b);
      ctx.strokeStyle = color || '#e0a800';
      ctx.lineWidth = size || 4;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    }

    function drawDot(point, color, size) {
      const p = denorm(point);
      ctx.fillStyle = color || '#e0a800';
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(2, (size || 4) * 0.65), 0, Math.PI * 2);
      ctx.fill();
    }

    function drawStar(point, color) {
      const p = denorm(point);
      ctx.save();
      ctx.fillStyle = color || '#f2c94c';
      ctx.strokeStyle = '#7a5900';
      ctx.lineWidth = 1.5;
      ctx.font = '32px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('*', p.x, p.y);
      ctx.strokeText('*', p.x, p.y);
      ctx.restore();
    }

    function emit(eventName, payload) {
      if (!socket || !socket.connected) return;
      socket.emit(eventName, { roomId: roomInput.value, ...payload }, function (ack) {
        if (ack && !ack.ok) log(`${eventName} rejected: ${ack.error}`);
      });
    }

    function connect() {
      if (socket) socket.disconnect();
      statusEl.textContent = 'connecting';
      socket = io({
        query: { roomId: roomInput.value, role: roleInput.value },
        reconnection: true,
        reconnectionAttempts: Infinity,
        reconnectionDelay: 500
      });

      socket.on('connect', function () {
        statusEl.textContent = `connected ${socket.id}`;
        socket.emit('join-room', { roomId: roomInput.value }, function (ack) {
          log(`join-room ${JSON.stringify(ack)}`);
        });
      });
      socket.on('disconnect', function (reason) {
        statusEl.textContent = `disconnected: ${reason}`;
      });
      socket.on('connect_error', function (err) {
        statusEl.textContent = `connect error: ${err.message}`;
      });
      socket.on('live-ink:ready', function (data) { log(`ready ${JSON.stringify(data)}`); });
      socket.on('live-ink:presence', function (data) { log(`presence ${JSON.stringify(data)}`); });
      socket.on('live-ink:error', function (data) { log(`error ${JSON.stringify(data)}`); });
      socket.on('clear-ink', function () {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        log('remote clear');
      });
      socket.on('star', function (data) {
        drawStar(data, data.color);
        log(`remote star ${JSON.stringify(data)}`);
      });
      socket.on('ink-start', function (data) {
        const key = data.strokeId || data.senderId || 'remote';
        remoteLastByStroke.set(key, data);
        drawDot(data, data.color, data.size);
      });
      socket.on('ink-move', function (data) {
        const key = data.strokeId || data.senderId || 'remote';
        const previous = remoteLastByStroke.get(key);
        if (previous) drawLine(previous, data, data.color, data.size);
        else drawDot(data, data.color, data.size);
        remoteLastByStroke.set(key, data);
      });
      socket.on('ink-end', function (data) {
        const key = data.strokeId || data.senderId || 'remote';
        const previous = remoteLastByStroke.get(key);
        if (previous) drawLine(previous, data, data.color, data.size);
        remoteLastByStroke.delete(key);
      });
    }

    canvas.addEventListener('pointerdown', function (evt) {
      drawing = true;
      canvas.setPointerCapture(evt.pointerId);
      strokeId = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      localLast = pointFromEvent(evt);
      drawDot(localLast, '#f2c94c', 4);
      emit('ink-start', { strokeId, tool: 'pen', color: '#f2c94c', size: 4, ...localLast });
    });

    canvas.addEventListener('pointermove', function (evt) {
      if (!drawing) return;
      const now = Date.now();
      const point = pointFromEvent(evt);
      drawLine(localLast, point, '#f2c94c', 4);
      localLast = point;
      if (now - lastEmitAt >= 33) {
        lastEmitAt = now;
        emit('ink-move', { strokeId, tool: 'pen', color: '#f2c94c', size: 4, ...point });
      }
    });

    function finishStroke(evt) {
      if (!drawing) return;
      drawing = false;
      const point = pointFromEvent(evt);
      emit('ink-end', { strokeId, tool: 'pen', color: '#f2c94c', size: 4, ...point });
      localLast = null;
      strokeId = '';
    }

    canvas.addEventListener('pointerup', finishStroke);
    canvas.addEventListener('pointercancel', finishStroke);
    canvas.addEventListener('dblclick', function (evt) {
      const point = pointFromEvent(evt);
      drawStar(point, '#f2c94c');
      emit('star', { color: '#f2c94c', ...point });
    });

    document.getElementById('connect').addEventListener('click', connect);
    document.getElementById('clear').addEventListener('click', function () {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      emit('clear-ink', { t: Date.now() });
    });
    document.getElementById('star').addEventListener('click', function () {
      const point = { x: 0.5, y: 0.5, t: Date.now() };
      drawStar(point, '#f2c94c');
      emit('star', { color: '#f2c94c', ...point });
    });

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    connect();
  </script>
</body>
</html>
